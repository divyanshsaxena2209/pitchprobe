name: Backend model integration checks

on:
  push:
    branches: [feature/deberta-risk-model-loader]
    paths:
      - "backend/**"
      - "README.md"
      - ".github/workflows/backend-model-integration.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "README.md"
      - ".github/workflows/backend-model-integration.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend and test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx reportlab

      - name: Run backend regression suite
        env:
          PITCHPROBE_DEVICE: cpu
        run: |
          python -m pytest backend/tests -q
