name: Research quick checks

on:
  push:
    branches: [finetuning-lab]
    paths:
      - "training/**"
      - ".github/workflows/research-quick-checks.yml"
  pull_request:
    branches: [finetuning-lab]
    paths:
      - "training/**"
      - ".github/workflows/research-quick-checks.yml"

permissions:
  contents: read

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          # These quick checks do not load a transformer or train a model.
          # Avoid installing PyTorch/CUDA just to test pandas/sklearn/dataset prep.
          python -m pip install "pandas>=2.2,<3" "scikit-learn>=1.5,<2" "datasets>=3.2,<4" pytest

      - name: Run quick regression tests
        run: |
          python -m pytest \
            training/test_question_bank_router.py \
            training/test_create_risk_review_sheet.py \
            training/test_dataset_prep.py \
            -q

      - name: Run the six-claim question retrieval smoke test
        run: |
          python -m training.question_bank_router \
            --claims-csv training/data/question_router_smoke_claims.csv \
            --output-csv /tmp/question_bank_smoke_matches.csv \
            --top-k 1

      - name: Print question/evidence preview in workflow logs
        run: |
          python - <<'PY'
          import pandas as pd
          matches = pd.read_csv("/tmp/question_bank_smoke_matches.csv")
          columns = [
              "claim", "dimension_route", "dimension",
              "retrieval_score", "question_for_claim",
              "evidence_to_request", "contradiction_signal",
          ]
          for index, row in matches.iterrows():
              print(f"\\n--- Claim {index + 1} ---")
              for column in columns:
                  print(f"{column}: {row[column]}")
          assert len(matches) == 6, f"Expected 6 smoke-test matches, got {len(matches)}"
          assert matches["question_for_claim"].fillna("").str.len().min() > 20
          assert "retrieval_score" in matches.columns
          assert "claim_similarity" in matches.columns
          PY

      - name: Upload six-claim question preview
        uses: actions/upload-artifact@v4
        with:
          name: question-bank-smoke-matches
          path: /tmp/question_bank_smoke_matches.csv
          retention-days: 7
